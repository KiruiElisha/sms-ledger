[project]
name = "sms_ledger"
authors = [
    { name = "Sol", email = "cursor953@gmail.com" }
]
description = "Post M-PESA and bank SMS alerts (KCB and others) to ERPNext as accounting entries"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
