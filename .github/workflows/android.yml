name: Android app

# Builds the phone app (android/) and, on main, publishes the APK as a GitHub
# Release (android-v0.1.<run>), so the phone can install it straight from the
# release page. Signed with your key when the SMS_LEDGER_KEYSTORE_* secrets are
# set, otherwise with android/app/sideload.keystore.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use your signing key, if set
        env:
          KEYSTORE_BASE64: ${{ secrets.SMS_LEDGER_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SMS_LEDGER_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          SMS_LEDGER_KEYSTORE_PASSWORD: ${{ secrets.SMS_LEDGER_KEYSTORE_PASSWORD }}
          SMS_LEDGER_KEY_ALIAS: ${{ secrets.SMS_LEDGER_KEY_ALIAS }}
          SMS_LEDGER_KEY_PASSWORD: ${{ secrets.SMS_LEDGER_KEY_PASSWORD }}
        run: |
          # An unset secret arrives as an empty string; let build.gradle.kts fall back instead.
          for v in SMS_LEDGER_KEYSTORE_PASSWORD SMS_LEDGER_KEY_ALIAS SMS_LEDGER_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../sms-ledger-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sms-ledger-apk
          path: sms-ledger-*.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: SMS Ledger ${{ env.VERSION_NAME }}
          body: Install on the phone that receives the M-PESA and bank messages. See android/README.md.
          files: sms-ledger-*.apk
